</style><rect class="bg" width="760" height="330" rx="6"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="lnf"/></marker></defs><text x="20" y="30" class="t1" font-size="14" text-anchor="start" font-weight="bold">da senha ao dado guardado</text><rect x="30" y="60" width="150" height="58" rx="6" class="box" stroke-width="1.5"/><text x="42" y="82" class="t1" font-size="13" text-anchor="start" font-weight="bold">senha</text><text x="42" y="102" class="t2" font-size="11.5" text-anchor="start" font-weight="normal">nunca é guardada</text><rect x="30" y="140" width="150" height="58" rx="6" class="box" stroke-width="1.5"/><text x="42" y="162" class="t1" font-size="13" text-anchor="start" font-weight="bold">sal aleatório</text><text x="42" y="182" class="t2" font-size="11.5" text-anchor="start" font-weight="normal">criado com a base</text><rect x="230" y="92" width="170" height="74" rx="6" class="b2" stroke-width="1.5"/><text x="242" y="114" class="t1" font-size="13" text-anchor="start" font-weight="bold">PBKDF2</text><text x="242" y="134" class="t2" font-size="11.5" text-anchor="start" font-weight="normal">SHA-256</text><text x="242" y="151" class="t2" font-size="11.5" text-anchor="start" font-weight="normal">250.000 iterações</text><rect x="450" y="92" width="140" height="74" rx="6" class="b1" stroke-width="1.5"/><text x="462" y="114" class="t1" font-size="13" text-anchor="start" font-weight="bold">chave</text><text x="462" y="134" class="t2" font-size="11.5" text-anchor="start" font-weight="normal">AES-GCM</text><text x="462" y="151" class="t2" font-size="11.5" text-anchor="start" font-weight="normal">256 bits</text><rect x="450" y="220" width="140" height="74" rx="6" class="b1" stroke-width="1.5"/><text x="462" y="242" class="t1" font-size="13" text-anchor="start" font-weight="bold">registro</text><text x="462" y="262" class="t2" font-size="11.5" text-anchor="start" font-weight="normal">cifrado com IV novo</text><text x="462" y="279" class="t2" font-size="11.5" text-anchor="start" font-weight="normal">a cada gravação</text><rect x="625" y="220" width="115" height="74" rx="6" class="b3" stroke-width="1.5"/><text x="637" y="242" class="t1" font-size="13" text-anchor="start" font-weight="bold">IndexedDB</text><text x="637" y="262" class="t2" font-size="11.5" text-anchor="start" font-weight="normal">só dado cifrado</text><rect x="625" y="92" width="115" height="74" rx="6" class="box" stroke-width="1.5"/><text x="637" y="114" class="t1" font-size="13" text-anchor="start" font-weight="bold">verificador</text><text x="637" y="134" class="t2" font-size="11.5" text-anchor="start" font-weight="normal">diz &quot;senha</text><text x="637" y="151" class="t2" font-size="11.5" text-anchor="start" font-weight="normal">incorreta&quot;</text><line x1="180" y1="89" x2="230" y2="118" class="ln" stroke-width="1.6" marker-end="url(#a)"/><line x1="180" y1="169" x2="230" y2="142" class="ln" stroke-width="1.6" marker-end="url(#a)"/><line x1="400" y1="129" x2="450" y2="129" class="ln" stroke-width="1.6" marker-end="url(#a)"/><line x1="520" y1="166" x2="520" y2="220" class="ln" stroke-width="1.6" marker-end="url(#a)"/><line x1="590" y1="257" x2="625" y2="257" class="ln" stroke-width="1.6" marker-end="url(#a)"/><line x1="590" y1="129" x2="625" y2="129" class="ln" stroke-width="1.6" marker-end="url(#a)"/><text x="30" y="318" class="t2" font-size="11.5" text-anchor="start" font-weight="normal">backup: a base cifrada é exportada como arquivo. sem a senha, ele não serve para nada.</text></svg>