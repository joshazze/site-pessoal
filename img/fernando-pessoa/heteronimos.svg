<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img"><title>Marcus, Rogi e Stefano</title><style>
text{font-family:Verdana,Geneva,Tahoma,sans-serif}
.bg{fill:#fcfcfb}.t1{fill:#0b0b0b}.t2{fill:#52514e}.ln{stroke:#c9c8c2}.lnf{fill:#c9c8c2}
.s1{fill:#2a78d6}.s1s{stroke:#2a78d6}.s2{fill:#eb6834}.s2s{stroke:#eb6834}.s3{fill:#1baf7a}.s3s{stroke:#1baf7a}
.box{fill:#f2f1ed;stroke:#c9c8c2}.b1{fill:#eaf1fb;stroke:#2a78d6}.b2{fill:#fcefe8;stroke:#eb6834}.b3{fill:#e7f6f0;stroke:#1baf7a}
@media (prefers-color-scheme: dark){
.bg{fill:#1a1a19}.t1{fill:#f0efec}.t2{fill:#c3c2b7}.ln{stroke:#55544f}.lnf{fill:#55544f}
.s1{fill:#3987e5}.s1s{stroke:#3987e5}.s2{fill:#d95926}.s2s{stroke:#d95926}.s3{fill:#199e70}.s3s{stroke:#199e70}
.box{fill:#24241f;stroke:#55544f}.b1{fill:#1b2633;stroke:#3987e5}.b2{fill:#30211a;stroke:#d95926}.b3{fill:#172a23;stroke:#199e70}}
</style><rect class="bg" width="760" height="300" rx="6"/><text x="20" y="30" class="t1" font-size="14" text-anchor="start" font-weight="bold">os heterônimos que mais uso</text><rect x="25" y="50" width="230" height="230" rx="8" class="b1" stroke-width="1.5"/><text x="39" y="78" class="t1" font-size="14" text-anchor="start" font-weight="bold">Marcus Domenicano</text><text x="39" y="97" class="t2" font-size="12" text-anchor="start" font-weight="normal">arquivista</text><text x="39" y="128" class="t1" font-size="11.5" text-anchor="start" font-weight="normal">transforma material bruto em</text><text x="39" y="146" class="t1" font-size="11.5" text-anchor="start" font-weight="normal">nota de vault, sem perder</text><text x="39" y="164" class="t1" font-size="11.5" text-anchor="start" font-weight="normal">informação</text><text x="39" y="222" class="t2" font-size="10.5" text-anchor="start" font-weight="normal">gatilho</text><text x="39" y="238" class="t1" font-size="11.5" text-anchor="start" font-weight="normal">chamado pelo nome</text><text x="39" y="258" class="t2" font-size="10.5" text-anchor="start" font-weight="normal">persistência</text><text x="39" y="274" class="t1" font-size="11.5" text-anchor="start" font-weight="normal">camada 1</text><rect x="270" y="50" width="230" height="230" rx="8" class="b2" stroke-width="1.5"/><text x="284" y="78" class="t1" font-size="14" text-anchor="start" font-weight="bold">Rogi</text><text x="284" y="97" class="t2" font-size="12" text-anchor="start" font-weight="normal">escrita</text><text x="284" y="128" class="t1" font-size="11.5" text-anchor="start" font-weight="normal">voz de texto humano, sem</text><text x="284" y="146" class="t1" font-size="11.5" text-anchor="start" font-weight="normal">travessão; todo texto passa</text><text x="284" y="164" class="t1" font-size="11.5" text-anchor="start" font-weight="normal">pelo detector antes de sair</text><text x="284" y="222" class="t2" font-size="10.5" text-anchor="start" font-weight="normal">gatilho</text><text x="284" y="238" class="t1" font-size="11.5" text-anchor="start" font-weight="normal">ambiente, toda conversa</text><text x="284" y="258" class="t2" font-size="10.5" text-anchor="start" font-weight="normal">persistência</text><text x="284" y="274" class="t1" font-size="11.5" text-anchor="start" font-weight="normal">camadas 1, 2 e 3</text><rect x="515" y="50" width="230" height="230" rx="8" class="b3" stroke-width="1.5"/><text x="529" y="78" class="t1" font-size="14" text-anchor="start" font-weight="bold">Stefano Camarões</text><text x="529" y="97" class="t2" font-size="12" text-anchor="start" font-weight="normal">professor</text><text x="529" y="128" class="t1" font-size="11.5" text-anchor="start" font-weight="normal">ensina e não resolve: quem</text><text x="529" y="146" class="t1" font-size="11.5" text-anchor="start" font-weight="normal">digita o exercício é o aluno</text><text x="529" y="222" class="t2" font-size="10.5" text-anchor="start" font-weight="normal">gatilho</text><text x="529" y="238" class="t1" font-size="11.5" text-anchor="start" font-weight="normal">contexto de estudo</text><text x="529" y="258" class="t2" font-size="10.5" text-anchor="start" font-weight="normal">persistência</text><text x="529" y="274" class="t1" font-size="11.5" text-anchor="start" font-weight="normal">guarda que bloqueia escrita</text></svg>