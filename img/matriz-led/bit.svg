<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 345" width="760" height="345" role="img"><title>Forma de onda de um bit do WS2812B</title><style>
text{font-family:Verdana,Geneva,Tahoma,sans-serif}
.bg{fill:#fcfcfb}.t1{fill:#0b0b0b}.t2{fill:#52514e}.ln{stroke:#c9c8c2}.lnf{fill:#c9c8c2}.gr{stroke:#e4e3df}
.s1{fill:#2a78d6}.s1s{stroke:#2a78d6}.s2{fill:#eb6834}.s2s{stroke:#eb6834}.s3{fill:#1baf7a}.s3s{stroke:#1baf7a}.off{fill:#c9c8c2}
.box{fill:#f2f1ed;stroke:#c9c8c2}.b1{fill:#eaf1fb;stroke:#2a78d6}.b2{fill:#fcefe8;stroke:#eb6834}.b3{fill:#e7f6f0;stroke:#1baf7a}
.lcd{fill:#9bbd3a}.px0{fill:#8fb132}.px1{fill:#1f2b0c}
@media (prefers-color-scheme: dark){
.bg{fill:#1a1a19}.t1{fill:#f0efec}.t2{fill:#c3c2b7}.ln{stroke:#55544f}.lnf{fill:#55544f}.gr{stroke:#33332f}
.s1{fill:#3987e5}.s1s{stroke:#3987e5}.s2{fill:#d95926}.s2s{stroke:#d95926}.s3{fill:#199e70}.s3s{stroke:#199e70}.off{fill:#4a4944}
.box{fill:#24241f;stroke:#55544f}.b1{fill:#1b2633;stroke:#3987e5}.b2{fill:#30211a;stroke:#d95926}.b3{fill:#172a23;stroke:#199e70}}
</style><rect class="bg" width="760" height="345" rx="6"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="lnf"/></marker></defs><text x="20" y="30" class="t1" font-size="14" text-anchor="start" font-weight="bold">um bit do WS2812B, montado com escritas de 125 ns no pino</text><line x1="150" x2="150" y1="62" y2="262" class="gr" stroke-width="1" stroke-dasharray="3 3"/><line x1="212" x2="212" y1="62" y2="262" class="gr" stroke-width="1" stroke-dasharray="3 3"/><line x1="274" x2="274" y1="62" y2="262" class="gr" stroke-width="1" stroke-dasharray="3 3"/><line x1="336" x2="336" y1="62" y2="262" class="gr" stroke-width="1" stroke-dasharray="3 3"/><line x1="398" x2="398" y1="62" y2="262" class="gr" stroke-width="1" stroke-dasharray="3 3"/><line x1="460" x2="460" y1="62" y2="262" class="gr" stroke-width="1" stroke-dasharray="3 3"/><line x1="522" x2="522" y1="62" y2="262" class="gr" stroke-width="1" stroke-dasharray="3 3"/><text x="20" y="108" class="t1" font-size="12.5" text-anchor="start" font-weight="bold">bit 0</text><polyline fill="none" stroke-width="2.5" class="s1s" points="150,120 150,80 212,80 212,80 274,80 274,80 336,80 336,120 398,120 398,120 460,120 460,120 522,120 522,120"/><text x="243.0" y="72" class="t2" font-size="11" text-anchor="middle" font-weight="normal">alto por 3 escritas: 375 ns</text><text x="20" y="208" class="t1" font-size="12.5" text-anchor="start" font-weight="bold">bit 1</text><polyline fill="none" stroke-width="2.5" class="s2s" points="150,220 150,180 212,180 212,180 274,180 274,180 336,180 336,180 398,180 398,220 460,220 460,220 522,220 522,220"/><text x="274" y="172" class="t2" font-size="11" text-anchor="middle" font-weight="normal">alto por 4 escritas: 500 ns</text><text x="181.0" y="282" class="t2" font-size="10.5" text-anchor="middle" font-weight="normal">125 ns</text><text x="243.0" y="282" class="t2" font-size="10.5" text-anchor="middle" font-weight="normal">125 ns</text><text x="305.0" y="282" class="t2" font-size="10.5" text-anchor="middle" font-weight="normal">125 ns</text><text x="367.0" y="282" class="t2" font-size="10.5" text-anchor="middle" font-weight="normal">125 ns</text><text x="429.0" y="282" class="t2" font-size="10.5" text-anchor="middle" font-weight="normal">125 ns</text><text x="491.0" y="282" class="t2" font-size="10.5" text-anchor="middle" font-weight="normal">125 ns</text><text x="20" y="312" class="t2" font-size="11" text-anchor="start" font-weight="normal">A quarta escrita decide: se o bit vale 1 o fio continua alto, se vale 0 ele desce. Depois vem a descida final,</text><text x="20" y="328" class="t2" font-size="11" text-anchor="start" font-weight="normal">o deslocamento do byte e a volta do laço, que completam o período do bit.</text></svg>