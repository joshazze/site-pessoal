<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img"><title>As três camadas do detector</title><style>
text{font-family:Verdana,Geneva,Tahoma,sans-serif}
.bg{fill:#fcfcfb}.t1{fill:#0b0b0b}.t2{fill:#52514e}.ln{stroke:#c9c8c2}.lnf{fill:#c9c8c2}
.s1{fill:#2a78d6}.s1s{stroke:#2a78d6}.s2{fill:#eb6834}.s2s{stroke:#eb6834}.s3{fill:#1baf7a}.s3s{stroke:#1baf7a}
.box{fill:#f2f1ed;stroke:#c9c8c2}.b1{fill:#eaf1fb;stroke:#2a78d6}.b2{fill:#fcefe8;stroke:#eb6834}.b3{fill:#e7f6f0;stroke:#1baf7a}
@media (prefers-color-scheme: dark){
.bg{fill:#1a1a19}.t1{fill:#f0efec}.t2{fill:#c3c2b7}.ln{stroke:#55544f}.lnf{fill:#55544f}
.s1{fill:#3987e5}.s1s{stroke:#3987e5}.s2{fill:#d95926}.s2s{stroke:#d95926}.s3{fill:#199e70}.s3s{stroke:#199e70}
.box{fill:#24241f;stroke:#55544f}.b1{fill:#1b2633;stroke:#3987e5}.b2{fill:#30211a;stroke:#d95926}.b3{fill:#172a23;stroke:#199e70}}
</style><rect class="bg" width="760" height="330" rx="6"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="lnf"/></marker></defs><text x="20" y="30" class="t1" font-size="14" text-anchor="start" font-weight="bold">três camadas, da mais barata para a mais cara</text><rect x="40" y="50" width="680" height="74" rx="6" class="b2" stroke-width="1.5"/><text x="52" y="72" class="t1" font-size="13" text-anchor="start" font-weight="bold">1 · Unicode escondido · sem chave, microssegundos</text><text x="52" y="92" class="t2" font-size="11.5" text-anchor="start" font-weight="normal">largura zero, seletores de variação, tag characters, controles bidirecionais, letras de</text><text x="52" y="109" class="t2" font-size="11.5" text-anchor="start" font-weight="normal">alfabetos misturados na mesma palavra. Se houver mensagem escondida, o relatório mostra.</text><rect x="40" y="138" width="680" height="74" rx="6" class="b2" stroke-width="1.5"/><text x="52" y="160" class="t1" font-size="13" text-anchor="start" font-weight="bold">2 · marca d&#x27;água estatística · exige a chave do provedor</text><text x="52" y="180" class="t2" font-size="11.5" text-anchor="start" font-weight="normal">green list (Kirchenbauer), esquema de Aaronson e SynthID-Text, cada um com p-valor exato</text><text x="52" y="197" class="t2" font-size="11.5" text-anchor="start" font-weight="normal">e comparado com o mesmo teste rodado com chaves falsas no mesmo texto.</text><rect x="40" y="226" width="680" height="74" rx="6" class="b1" stroke-width="1.5"/><text x="52" y="248" class="t1" font-size="13" text-anchor="start" font-weight="bold">3 · estilo · sem modelo, milissegundos</text><text x="52" y="268" class="t2" font-size="11.5" text-anchor="start" font-weight="normal">67 características calibradas para PT-BR: ritmo das frases, conectivos no início,</text><text x="52" y="285" class="t2" font-size="11.5" text-anchor="start" font-weight="normal">enumerações em três, tipo de aspas. Gera só estimativa, nunca prova.</text></svg>