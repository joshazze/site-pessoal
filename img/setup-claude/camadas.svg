</style><rect class="bg" width="760" height="354" rx="6"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="lnf"/></marker></defs><text x="20" y="30" class="t1" font-size="14" text-anchor="start" font-weight="bold">uma frase colada, três camadas instaladas em ordem</text><rect x="40" y="52" width="680" height="46" rx="6" class="box" stroke-width="1.5"/><text x="380" y="80" class="t1" font-size="12.5" text-anchor="middle" font-weight="bold">leia o roteiro e execute  ·  ou  ./instalar.sh</text><line x1="148" x2="148" y1="98" y2="128" class="ln" stroke-width="1.5" marker-end="url(#a)"/><rect x="40" y="130" width="216" height="104" rx="6" class="b1" stroke-width="1.5"/><text x="54" y="154" class="t1" font-size="13" text-anchor="start" font-weight="bold">A · Cérebro</text><text x="54" y="174" class="t1" font-size="11.5" text-anchor="start" font-weight="normal">memória entre sessões</text><text x="54" y="198" class="t2" font-size="11" text-anchor="start" font-weight="normal">cofre de notas, índice de</text><text x="54" y="214" class="t2" font-size="11" text-anchor="start" font-weight="normal">cerca de 1.100 tokens por sessão</text><line x1="148" x2="148" y1="234" y2="264" class="ln" stroke-width="1.5" marker-end="url(#a)"/><line x1="380" x2="380" y1="98" y2="128" class="ln" stroke-width="1.5" marker-end="url(#a)"/><rect x="272" y="130" width="216" height="104" rx="6" class="b2" stroke-width="1.5"/><text x="286" y="154" class="t1" font-size="13" text-anchor="start" font-weight="bold">B · Heterónimos</text><text x="286" y="174" class="t1" font-size="11.5" text-anchor="start" font-weight="normal">quem ele é em cada tarefa</text><text x="286" y="198" class="t2" font-size="11" text-anchor="start" font-weight="normal">personas com gatilho próprio,</text><text x="286" y="214" class="t2" font-size="11" text-anchor="start" font-weight="normal">spec lida só quando dispara</text><line x1="380" x2="380" y1="234" y2="264" class="ln" stroke-width="1.5" marker-end="url(#a)"/><line x1="612" x2="612" y1="98" y2="128" class="ln" stroke-width="1.5" marker-end="url(#a)"/><rect x="504" y="130" width="216" height="104" rx="6" class="b3" stroke-width="1.5"/><text x="518" y="154" class="t1" font-size="13" text-anchor="start" font-weight="bold">C · Editor</text><text x="518" y="174" class="t1" font-size="11.5" text-anchor="start" font-weight="normal">onde a pessoa escreve</text><text x="518" y="198" class="t2" font-size="11" text-anchor="start" font-weight="normal">Obsidian, plugin de captura,</text><text x="518" y="214" class="t2" font-size="11" text-anchor="start" font-weight="normal">assistente dentro do cofre</text><line x1="612" x2="612" y1="234" y2="264" class="ln" stroke-width="1.5" marker-end="url(#a)"/><rect x="40" y="266" width="680" height="46" rx="6" class="box" stroke-width="1.5"/><text x="380" y="294" class="t1" font-size="12.5" text-anchor="middle" font-weight="bold">diagnóstico das três camadas  ·  explicação final obrigatória</text><text x="40" y="338" class="t2" font-size="11" text-anchor="start" font-weight="normal">JSON existente é mesclado com backup datado. Nenhuma nota do cofre é sobrescrita.</text></svg>