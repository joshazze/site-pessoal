<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" font-family="Inter, Helvetica, Arial, sans-serif">
  <rect width="900" height="470" fill="#fcfcfb"/>
  <text x="50" y="38" font-size="13" font-weight="600" fill="#0b0b0b">as três camadas de persistência de uma persona, e o que cada uma resolve</text>

  <!-- eixo do tempo de vida -->
  <text x="50" y="76" font-size="11" fill="#8a8983">escala de tempo em que cada camada age</text>
  <line x1="50" y1="92" x2="850" y2="92" stroke="#e6e5e1" stroke-width="1.5"/>
  <g font-size="10" fill="#8a8983">
    <text x="50" y="110">uma ação</text>
    <text x="330" y="110" text-anchor="middle">um turno</text>
    <text x="600" y="110" text-anchor="middle">uma sessão</text>
    <text x="850" y="110" text-anchor="end">entre sessões</text>
  </g>

  <!-- camada 1 -->
  <rect x="50" y="130" width="800" height="94" rx="6" fill="#2a78d6" fill-opacity="0.07" stroke="#2a78d6" stroke-width="1.4"/>
  <text x="70" y="156" font-size="13" font-weight="600" fill="#0b0b0b">1 · Definição</text>
  <text x="70" y="178" font-size="12" fill="#52514e">bloco no arquivo de instruções globais, carregado inteiro em toda sessão.</text>
  <text x="70" y="198" font-size="12" fill="#52514e">É a especificação: quem é a persona, qual a obsessão, onde está a fronteira.</text>
  <text x="70" y="216" font-size="11" fill="#8a8983">falha típica: a regra entra na sessão e se dilui sob vinte mil tokens de conversa.</text>

  <!-- camada 2 -->
  <rect x="50" y="238" width="800" height="118" rx="6" fill="#eb6834" fill-opacity="0.07" stroke="#eb6834" stroke-width="1.4"/>
  <text x="70" y="264" font-size="13" font-weight="600" fill="#0b0b0b">2 · Gancho</text>
  <text x="70" y="286" font-size="12" fill="#52514e">script disparado por evento do runtime. Duas variantes, escolhidas pelo gatilho:</text>
  <g font-size="11">
    <rect x="70" y="298" width="368" height="44" rx="5" fill="#fcfcfb" stroke="#eb6834" stroke-width="1"/>
    <text x="84" y="316" font-weight="600" fill="#0b0b0b">reforço · UserPromptSubmit</text>
    <text x="84" y="333" fill="#52514e">reinjeta a regra a cada turno. Persona ambiente.</text>
    <rect x="454" y="298" width="396" height="44" rx="5" fill="#fcfcfb" stroke="#eb6834" stroke-width="1"/>
    <text x="468" y="316" font-weight="600" fill="#0b0b0b">guarda · PreToolUse</text>
    <text x="468" y="333" fill="#52514e">intercepta a ação e nega. Instrução em prosa não nega nada.</text>
  </g>

  <!-- camada 3 -->
  <rect x="50" y="370" width="800" height="76" rx="6" fill="#1baf7a" fill-opacity="0.07" stroke="#1baf7a" stroke-width="1.4"/>
  <text x="70" y="396" font-size="13" font-weight="600" fill="#0b0b0b">3 · Memória</text>
  <text x="70" y="418" font-size="12" fill="#52514e">registro durável mais ponteiro no índice: a persona sobrevive ao fim da sessão.</text>
  <text x="70" y="436" font-size="11" fill="#8a8983">sem esta camada, cada correção do usuário precisa ser repetida amanhã.</text>

  <!-- faixas de alcance -->
  <g stroke-width="6" stroke-linecap="round" opacity="0.85">
    <line x1="600" y1="120" x2="850" y2="120" stroke="#2a78d6"/>
    <line x1="50" y1="120" x2="470" y2="120" stroke="#eb6834"/>
    <line x1="820" y1="120" x2="850" y2="120" stroke="#1baf7a"/>
  </g>
</svg>
