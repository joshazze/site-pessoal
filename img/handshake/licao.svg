<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 150" width="760" height="150" role="img"><title>Ordem de montagem da lição</title><style>
text{font-family:Verdana,Geneva,Tahoma,sans-serif}
.bg{fill:#fcfcfb}.t1{fill:#0b0b0b}.t2{fill:#52514e}.ln{stroke:#c9c8c2}.lnf{fill:#c9c8c2}
.s1{fill:#2a78d6}.s1s{stroke:#2a78d6}.s2{fill:#eb6834}.s2s{stroke:#eb6834}.s3{fill:#1baf7a}.s3s{stroke:#1baf7a}
.box{fill:#f2f1ed;stroke:#c9c8c2}.b1{fill:#eaf1fb;stroke:#2a78d6}.b2{fill:#fcefe8;stroke:#eb6834}.b3{fill:#e7f6f0;stroke:#1baf7a}
@media (prefers-color-scheme: dark){
.bg{fill:#1a1a19}.t1{fill:#f0efec}.t2{fill:#c3c2b7}.ln{stroke:#55544f}.lnf{fill:#55544f}
.s1{fill:#3987e5}.s1s{stroke:#3987e5}.s2{fill:#d95926}.s2s{stroke:#d95926}.s3{fill:#199e70}.s3s{stroke:#199e70}
.box{fill:#24241f;stroke:#55544f}.b1{fill:#1b2633;stroke:#3987e5}.b2{fill:#30211a;stroke:#d95926}.b3{fill:#172a23;stroke:#199e70}}
</style><rect class="bg" width="760" height="150" rx="6"/><text x="20" y="30" class="t1" font-size="14" text-anchor="start" font-weight="bold">como as 25 questões do dia são escolhidas</text><rect x="30" y="55" width="215" height="64" rx="6" class="b2" stroke-width="1.5"/><text x="42" y="77" class="t1" font-size="13" text-anchor="start" font-weight="bold">1. vencidos</text><text x="42" y="97" class="t2" font-size="11.5" text-anchor="start" font-weight="normal">revisões com prazo hoje</text><text x="258" y="92" class="t2" font-size="20" text-anchor="middle">→</text><rect x="275" y="55" width="215" height="64" rx="6" class="b1" stroke-width="1.5"/><text x="287" y="77" class="t1" font-size="13" text-anchor="start" font-weight="bold">2. novos</text><text x="287" y="97" class="t2" font-size="11.5" text-anchor="start" font-weight="normal">na ordem da trilha</text><text x="503" y="92" class="t2" font-size="20" text-anchor="middle">→</text><rect x="520" y="55" width="215" height="64" rx="6" class="b3" stroke-width="1.5"/><text x="532" y="77" class="t1" font-size="13" text-anchor="start" font-weight="bold">3. reforço</text><text x="532" y="97" class="t2" font-size="11.5" text-anchor="start" font-weight="normal">os conceitos mais fracos</text><text x="30" y="140" class="t2" font-size="11.5" text-anchor="start" font-weight="normal">a lista enche nessa ordem até completar 25; completar a lição mantém a sequência de dias.</text></svg>