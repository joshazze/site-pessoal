<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" role="img"><title>Pipeline de reconhecimento das figurinhas</title><style>
text{font-family:Verdana,Geneva,Tahoma,sans-serif}
.bg{fill:#fcfcfb}.t1{fill:#0b0b0b}.t2{fill:#52514e}.ln{stroke:#c9c8c2}.lnf{fill:#c9c8c2}
.s1{fill:#2a78d6}.s1s{stroke:#2a78d6}.s2{fill:#eb6834}.s2s{stroke:#eb6834}.s3{fill:#1baf7a}.s3s{stroke:#1baf7a}
.box{fill:#f2f1ed;stroke:#c9c8c2}.b1{fill:#eaf1fb;stroke:#2a78d6}.b2{fill:#fcefe8;stroke:#eb6834}.b3{fill:#e7f6f0;stroke:#1baf7a}
@media (prefers-color-scheme: dark){
.bg{fill:#1a1a19}.t1{fill:#f0efec}.t2{fill:#c3c2b7}.ln{stroke:#55544f}.lnf{fill:#55544f}
.s1{fill:#3987e5}.s1s{stroke:#3987e5}.s2{fill:#d95926}.s2s{stroke:#d95926}.s3{fill:#199e70}.s3s{stroke:#199e70}
.box{fill:#24241f;stroke:#55544f}.b1{fill:#1b2633;stroke:#3987e5}.b2{fill:#30211a;stroke:#d95926}.b3{fill:#172a23;stroke:#199e70}}
</style><rect class="bg" width="760" height="340" rx="6"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="lnf"/></marker></defs><text x="20" y="30" class="t1" font-size="14" text-anchor="start" font-weight="bold">do verso da figurinha ao código no álbum</text><rect x="30" y="60" width="120" height="70" rx="6" class="box" stroke-width="1.5"/><text x="42" y="82" class="t1" font-size="13" text-anchor="start" font-weight="bold">foto</text><text x="42" y="102" class="t2" font-size="11.5" text-anchor="start" font-weight="normal">enviada em até</text><text x="42" y="119" class="t2" font-size="11.5" text-anchor="start" font-weight="normal">2400 px</text><rect x="175" y="60" width="175" height="70" rx="6" class="b1" stroke-width="1.5"/><text x="187" y="82" class="t1" font-size="13" text-anchor="start" font-weight="bold">pré-processamento</text><text x="187" y="102" class="t2" font-size="11.5" text-anchor="start" font-weight="normal">contraste local</text><text x="187" y="119" class="t2" font-size="11.5" text-anchor="start" font-weight="normal">e 9 recortes (3x3)</text><rect x="380" y="60" width="140" height="70" rx="6" class="b1" stroke-width="1.5"/><text x="392" y="82" class="t1" font-size="13" text-anchor="start" font-weight="bold">OCR</text><text x="392" y="102" class="t2" font-size="11.5" text-anchor="start" font-weight="normal">RapidOCR,</text><text x="392" y="119" class="t2" font-size="11.5" text-anchor="start" font-weight="normal">várias passadas</text><rect x="550" y="60" width="180" height="70" rx="6" class="b2" stroke-width="1.5"/><text x="562" y="82" class="t1" font-size="13" text-anchor="start" font-weight="bold">normalização</text><text x="562" y="102" class="t2" font-size="11.5" text-anchor="start" font-weight="normal">maiúsculas, sem espaços,</text><text x="562" y="119" class="t2" font-size="11.5" text-anchor="start" font-weight="normal">O→0, I→1 só onde é dígito</text><rect x="380" y="190" width="350" height="84" rx="6" class="b1" stroke-width="1.5"/><text x="392" y="212" class="t1" font-size="13" text-anchor="start" font-weight="bold">casamento com o álbum</text><text x="392" y="232" class="t2" font-size="11.5" text-anchor="start" font-weight="normal">só prefixos que existem (seleções, FWC)</text><text x="392" y="249" class="t2" font-size="11.5" text-anchor="start" font-weight="normal">e números no intervalo válido; confiança</text><text x="392" y="266" class="t2" font-size="11.5" text-anchor="start" font-weight="normal">do OCR ≥ 0,88 e semelhança ≥ 94 se não for exato</text><rect x="30" y="190" width="300" height="84" rx="6" class="b3" stroke-width="1.5"/><text x="42" y="212" class="t1" font-size="13" text-anchor="start" font-weight="bold">promocionais de mesmo número</text><text x="42" y="232" class="t2" font-size="11.5" text-anchor="start" font-weight="normal">verso idêntico ao da regular: o código</text><text x="42" y="249" class="t2" font-size="11.5" text-anchor="start" font-weight="normal">nunca sai do OCR, a pessoa escolhe</text><text x="42" y="266" class="t2" font-size="11.5" text-anchor="start" font-weight="normal">num botão olhando a frente</text><line x1="150" y1="95" x2="175" y2="95" class="ln" stroke-width="1.6" marker-end="url(#a)"/><line x1="350" y1="95" x2="380" y2="95" class="ln" stroke-width="1.6" marker-end="url(#a)"/><line x1="520" y1="95" x2="550" y2="95" class="ln" stroke-width="1.6" marker-end="url(#a)"/><line x1="640" y1="130" x2="600" y2="190" class="ln" stroke-width="1.6" marker-end="url(#a)"/><text x="30" y="310" class="t2" font-size="11.5" text-anchor="start" font-weight="normal">um código que aparece várias vezes na mesma foto soma votos de confiança.</text></svg>