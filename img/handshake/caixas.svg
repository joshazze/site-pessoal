<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img"><title>Intervalos de revisão por caixa</title><style>
text{font-family:Verdana,Geneva,Tahoma,sans-serif}
.bg{fill:#fcfcfb}.t1{fill:#0b0b0b}.t2{fill:#52514e}.ln{stroke:#c9c8c2}.lnf{fill:#c9c8c2}
.s1{fill:#2a78d6}.s1s{stroke:#2a78d6}.s2{fill:#eb6834}.s2s{stroke:#eb6834}.s3{fill:#1baf7a}.s3s{stroke:#1baf7a}
.box{fill:#f2f1ed;stroke:#c9c8c2}.b1{fill:#eaf1fb;stroke:#2a78d6}.b2{fill:#fcefe8;stroke:#eb6834}.b3{fill:#e7f6f0;stroke:#1baf7a}
@media (prefers-color-scheme: dark){
.bg{fill:#1a1a19}.t1{fill:#f0efec}.t2{fill:#c3c2b7}.ln{stroke:#55544f}.lnf{fill:#55544f}
.s1{fill:#3987e5}.s1s{stroke:#3987e5}.s2{fill:#d95926}.s2s{stroke:#d95926}.s3{fill:#199e70}.s3s{stroke:#199e70}
.box{fill:#24241f;stroke:#55544f}.b1{fill:#1b2633;stroke:#3987e5}.b2{fill:#30211a;stroke:#d95926}.b3{fill:#172a23;stroke:#199e70}}
</style><rect class="bg" width="760" height="300" rx="6"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="lnf"/></marker></defs><text x="20" y="30" class="t1" font-size="14" text-anchor="start" font-weight="bold">intervalo até a próxima revisão de um conceito, por caixa</text><text x="100" y="75" class="t2" font-size="11.5" text-anchor="end" font-weight="normal">caixa 1</text><path class="s1" d="M110,62 L116.83333333333333,62 Q119.83333333333333,62 119.83333333333333,65 L119.83333333333333,77 Q119.83333333333333,80 116.83333333333333,80 L110,80 Z"/><text x="127.83333333333333" y="76" class="t1" font-size="11.5" text-anchor="start" font-weight="normal">1 dia</text><text x="100" y="103" class="t2" font-size="11.5" text-anchor="end" font-weight="normal">caixa 2</text><path class="s1" d="M110,90 L126.66666666666666,90 Q129.66666666666666,90 129.66666666666666,93 L129.66666666666666,105 Q129.66666666666666,108 126.66666666666666,108 L110,108 Z"/><text x="137.66666666666666" y="104" class="t1" font-size="11.5" text-anchor="start" font-weight="normal">2 dias</text><text x="100" y="131" class="t2" font-size="11.5" text-anchor="end" font-weight="normal">caixa 3</text><path class="s1" d="M110,118 L146.33333333333334,118 Q149.33333333333334,118 149.33333333333334,121 L149.33333333333334,133 Q149.33333333333334,136 146.33333333333334,136 L110,136 Z"/><text x="157.33333333333334" y="132" class="t1" font-size="11.5" text-anchor="start" font-weight="normal">4 dias</text><text x="100" y="159" class="t2" font-size="11.5" text-anchor="end" font-weight="normal">caixa 4</text><path class="s1" d="M110,146 L185.66666666666669,146 Q188.66666666666669,146 188.66666666666669,149 L188.66666666666669,161 Q188.66666666666669,164 185.66666666666669,164 L110,164 Z"/><text x="196.66666666666669" y="160" class="t1" font-size="11.5" text-anchor="start" font-weight="normal">8 dias</text><text x="100" y="187" class="t2" font-size="11.5" text-anchor="end" font-weight="normal">caixa 5</text><path class="s1" d="M110,174 L264.33333333333337,174 Q267.33333333333337,174 267.33333333333337,177 L267.33333333333337,189 Q267.33333333333337,192 264.33333333333337,192 L110,192 Z"/><text x="275.33333333333337" y="188" class="t1" font-size="11.5" text-anchor="start" font-weight="normal">16 dias</text><text x="100" y="215" class="t2" font-size="11.5" text-anchor="end" font-weight="normal">caixa 6</text><path class="s1" d="M110,202 L421.6666666666667,202 Q424.6666666666667,202 424.6666666666667,205 L424.6666666666667,217 Q424.6666666666667,220 421.6666666666667,220 L110,220 Z"/><text x="432.6666666666667" y="216" class="t1" font-size="11.5" text-anchor="start" font-weight="normal">32 dias</text><text x="100" y="243" class="t2" font-size="11.5" text-anchor="end" font-weight="normal">dominado</text><path class="s3" d="M110,230 L697.0,230 Q700.0,230 700.0,233 L700.0,245 Q700.0,248 697.0,248 L110,248 Z"/><text x="708.0" y="244" class="t1" font-size="11.5" text-anchor="start" font-weight="normal">60 dias</text><text x="110" y="278" class="t2" font-size="11" text-anchor="start" font-weight="normal">acertou: o conceito sobe uma caixa. errou: volta para a caixa 1 e reaparece 3 questões depois</text><text x="110" y="294" class="t2" font-size="11" text-anchor="start" font-weight="normal">e no fim da mesma lição, sempre com outra variante.</text></svg>