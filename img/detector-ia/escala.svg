</style><rect class="bg" width="760" height="170" rx="6"/><text x="20" y="30" class="t1" font-size="14" text-anchor="start" font-weight="bold">a nota diz de onde veio a evidência</text><rect x="40" y="62" width="655.959595959596" height="26" rx="4" class="b1" stroke-width="1.5"/><rect x="698.959595959596" y="62" width="21.04040404040404" height="26" rx="4" class="b2" stroke-width="1.5"/><text x="367.979797979798" y="80" class="t1" font-size="12" text-anchor="middle" font-weight="normal">estimativa · estatística de estilo · teto 96</text><text x="709.6969696969697" y="54" class="t1" font-size="12" text-anchor="middle" font-weight="bold">prova</text><text x="40.0" y="106" class="t2" font-size="10.5" text-anchor="middle" font-weight="normal">1</text><text x="204.84848484848484" y="106" class="t2" font-size="10.5" text-anchor="middle" font-weight="normal">25</text><text x="376.5656565656566" y="106" class="t2" font-size="10.5" text-anchor="middle" font-weight="normal">50</text><text x="548.2828282828283" y="106" class="t2" font-size="10.5" text-anchor="middle" font-weight="normal">75</text><text x="692.5252525252525" y="106" class="t2" font-size="10.5" text-anchor="middle" font-weight="normal">96</text><text x="720.0" y="106" class="t2" font-size="10.5" text-anchor="middle" font-weight="normal">100</text><text x="40" y="136" class="t2" font-size="11.5" text-anchor="start" font-weight="normal">estilo sugere autoria, não prova: há gente que escreve regular e IA que escreve irregular.</text><text x="40" y="154" class="t2" font-size="11.5" text-anchor="start" font-weight="normal">97 a 100 só aparece quando uma marca d&#x27;água invisível é encontrada no texto.</text></svg>