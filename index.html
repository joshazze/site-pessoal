<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Joshua Azze Distel</title>
<meta name="description" content="Joshua Azze Distel — Engenharia da Computação. Currículo Lattes, LinkedIn e GitHub.">
<meta name="theme-color" content="#f3f6fc" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d1220" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:      #f3f6fc;
    --surface: #ffffff;
    --ink:     #0b1020;
    --ink-2:   #46536f;
    --line:    #d7deec;
    --lattes:  #0e7c8c;
    --linkedin:#4a3ecf;
    --github:  #a85400;
    --shadow:  0 1px 2px rgba(11,16,32,.05), 0 18px 40px -28px rgba(11,16,32,.45);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg:      #0d1220;
      --surface: #161d31;
      --ink:     #f0f3fb;
      --ink-2:   #a9b6d4;
      --line:    #2b3450;
      --lattes:  #4ad6e8;
      --linkedin:#9d92ff;
      --github:  #ffb057;
      --shadow:  none;
    }
  }

  *, *::before, *::after { box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    min-height: 100svh;
    background: var(--bg);
    color: var(--ink);
    font-family: Archivo, system-ui, sans-serif;
    font-size: 17px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  /* aurora ambiente, unica coisa que se mexe sozinha */
  .aurora {
    position: fixed;
    inset: -30% -10% auto -10%;
    height: 75vh;
    z-index: 0;
    pointer-events: none;
    background:
      radial-gradient(38vmax 30vmax at 18% 22%, color-mix(in oklab, var(--lattes) 26%, transparent), transparent 62%),
      radial-gradient(34vmax 28vmax at 78% 12%, color-mix(in oklab, var(--linkedin) 24%, transparent), transparent 60%),
      radial-gradient(30vmax 26vmax at 55% 42%, color-mix(in oklab, var(--github) 18%, transparent), transparent 58%);
    filter: blur(34px);
    opacity: .5;
    animation: drift 26s ease-in-out infinite alternate;
  }

  @keyframes drift {
    from { transform: translate3d(-3%, -2%, 0) scale(1) }
    to   { transform: translate3d(4%, 3%, 0) scale(1.12) }
  }

  .wrap {
    position: relative;
    z-index: 1;
    max-width: 34rem;
    margin: 0 auto;
    padding: max(2.25rem, env(safe-area-inset-top)) 1.25rem 2.5rem;
  }

  .domain {
    display: inline-flex;
    align-items: center;
    gap: .55rem;
    margin: 0 0 1.5rem;
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 1rem;
    color: var(--ink-2);
  }

  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--lattes);
    animation: blink 2.8s ease-in-out infinite;
  }

  @keyframes blink { 0%, 100% { opacity: .35 } 50% { opacity: 1 } }

  h1 {
    margin: 0;
    font-size: clamp(2.75rem, 13vw, 4.25rem);
    font-weight: 800;
    line-height: 1;
    letter-spacing: -.025em;
    font-variation-settings: "wdth" 108;
    animation: open 1.1s cubic-bezier(.16, 1, .3, 1) both;
  }

  @keyframes open {
    from { font-variation-settings: "wdth" 78; opacity: 0 }
    to   { font-variation-settings: "wdth" 108; opacity: 1 }
  }

  .role {
    margin: .85rem 0 0;
    font-size: 1.1875rem;
    color: var(--ink-2);
    animation: up .7s ease .35s both;
  }

  @keyframes up { from { opacity: 0; transform: translateY(10px) } to { opacity: 1; transform: none } }

  .links {
    display: grid;
    gap: .875rem;
    margin: 2.5rem 0 0;
  }

  .card {
    --accent: var(--lattes);
    position: relative;
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: center;
    gap: .25rem 1rem;
    min-height: 5.5rem;
    padding: 1.15rem 1.25rem;
    border: 1px solid var(--line);
    border-left: 4px solid var(--accent);
    border-radius: 14px;
    background: var(--surface);
    box-shadow: var(--shadow);
    color: inherit;
    text-decoration: none;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    transition: transform .18s ease, border-color .25s ease;
    animation: up .7s ease both;
  }

  .card:nth-child(1) { animation-delay: .5s }
  .card:nth-child(2) { animation-delay: .6s }
  .card:nth-child(3) { animation-delay: .7s }

  /* clarao que nasce onde o dedo toca */
  .card::before {
    content: "";
    position: absolute;
    left: var(--mx, 50%);
    top: var(--my, 50%);
    width: 26rem;
    height: 26rem;
    margin: -13rem 0 0 -13rem;
    border-radius: 50%;
    background: radial-gradient(circle, color-mix(in oklab, var(--accent) 30%, transparent), transparent 65%);
    opacity: 0;
    transform: scale(.2);
    transition: opacity .5s ease, transform .5s cubic-bezier(.16, 1, .3, 1);
    pointer-events: none;
  }

  .card.lit::before { opacity: .55; transform: scale(1) }
  /* ciclo automatico em tela sem cursor: mais fraco que o toque */
  .card.auto::before { opacity: .4; transform: scale(1); transition: opacity 1.1s ease, transform 1.1s ease }
  .card:active { transform: scale(.985) }

  .name-line {
    grid-column: 1;
    font-size: 1.375rem;
    font-weight: 700;
    letter-spacing: -.01em;
  }

  .dest {
    grid-column: 1;
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 1rem;
    color: var(--ink-2);
  }

  .arrow {
    grid-column: 2;
    grid-row: 1 / span 2;
    width: 2.5rem;
    height: 2.5rem;
    display: grid;
    place-items: center;
    border-radius: 50%;
    background: color-mix(in oklab, var(--accent) 14%, transparent);
    color: var(--accent);
    font-size: 1.125rem;
    transition: transform .3s cubic-bezier(.16, 1, .3, 1);
  }

  .card:active .arrow { transform: translate(3px, -3px) }

  .card:focus-visible {
    outline: 3px solid var(--accent);
    outline-offset: 3px;
  }

  @media (hover: hover) {
    .card:hover { transform: translateY(-2px); border-color: var(--accent) }
    .card:hover .arrow { transform: translate(3px, -3px) }
  }

  .mail {
    display: block;
    margin-top: 2rem;
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 1.0625rem;
    color: var(--ink-2);
    text-decoration: none;
    border-bottom: 1px solid var(--line);
    padding-bottom: 3px;
    width: fit-content;
    animation: up .7s ease .8s both;
  }

  .mail:hover, .mail:focus-visible { color: var(--ink); border-color: var(--ink) }

  @media (min-width: 40rem) {
    body { font-size: 18px }
    .wrap { max-width: 40rem; padding-top: 5rem }
    .links { gap: 1rem }
    .card { min-height: 6rem; padding: 1.35rem 1.5rem }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition-duration: .01ms !important }
    h1 { font-variation-settings: "wdth" 108 }
  }
</style>
</head>
<body>
  <div class="aurora" aria-hidden="true"></div>

  <div class="wrap">
    <p class="domain"><span class="dot" aria-hidden="true"></span>jadistel.com</p>

    <h1>Joshua<br>Azze Distel</h1>
    <p class="role">Engenharia da Computação</p>

    <nav class="links" aria-label="Perfis">
      <a class="card" style="--accent: var(--lattes)" href="http://lattes.cnpq.br/0893551011803408">
        <span class="name-line">Currículo Lattes</span>
        <span class="dest">lattes.cnpq.br</span>
        <span class="arrow" aria-hidden="true">↗</span>
      </a>

      <a class="card" style="--accent: var(--linkedin)" href="https://www.linkedin.com/in/jadistel/">
        <span class="name-line">LinkedIn</span>
        <span class="dest">/in/jadistel</span>
        <span class="arrow" aria-hidden="true">↗</span>
      </a>

      <a class="card" style="--accent: var(--github)" href="https://github.com/joshazze">
        <span class="name-line">GitHub</span>
        <span class="dest">@joshazze</span>
        <span class="arrow" aria-hidden="true">↗</span>
      </a>
    </nav>

    <a class="mail" href="mailto:contato@jadistel.com">contato@jadistel.com</a>
  </div>

<script>
  /* o clarao segue o ponto exato do toque ou do cursor */
  for (const card of document.querySelectorAll('.card')) {
    const lit = e => {
      const r = card.getBoundingClientRect();
      card.style.setProperty('--mx', (e.clientX - r.left) + 'px');
      card.style.setProperty('--my', (e.clientY - r.top) + 'px');
      card.classList.add('lit');
    };
    const off = () => card.classList.remove('lit');
    card.addEventListener('pointerdown', lit);
    card.addEventListener('pointerenter', lit);
    card.addEventListener('pointerleave', off);
    card.addEventListener('pointercancel', off);
    card.addEventListener('focus', () => card.classList.add('lit'));
    card.addEventListener('blur', off);
  }

  /* sem cursor (celular), os cartoes acendem em ciclo pra mostrar que estao vivos */
  (() => {
    const semCursor = matchMedia('(hover: none)').matches;
    const parado = matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (!semCursor || parado) return;

    const cards = [...document.querySelectorAll('.card')];
    let i = 0, pausaAte = 0, timer;

    const apagar = () => cards.forEach(c => c.classList.remove('auto'));

    const passo = () => {
      if (document.hidden || Date.now() < pausaAte) return;
      apagar();
      const c = cards[i++ % cards.length];
      const r = c.getBoundingClientRect();
      c.style.setProperty('--mx', (r.width * 0.22).toFixed(0) + 'px');
      c.style.setProperty('--my', (r.height * 0.5).toFixed(0) + 'px');
      c.classList.add('auto');
      clearTimeout(timer);
      timer = setTimeout(() => c.classList.remove('auto'), 1600);
    };

    /* o toque do usuario manda: pausa o ciclo por 10s */
    addEventListener('pointerdown', () => { pausaAte = Date.now() + 10000; apagar(); }, { passive: true });
    document.addEventListener('visibilitychange', apagar);

    setTimeout(() => { passo(); setInterval(passo, 2600); }, 1600);
  })();
</script>
</body>
</html>
